<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Laptop Store</title>

    <link rel="stylesheet" href="css/pages/auth.css">
</head>

<body>
    
    <main class="auth-container">

        <section class="auth-info">
            <h1>Laptop Store</h1>
            <h2>Find the Perfect Laptop for Your Needs</h2>
            <p>
                Create your account and explore laptops
                designed for your academic and professional needs.
            </p>
        </section>

        <section class="auth-form-container">

            <form id="registerForm">

                <h2>Create Account</h2>
                <p class="subtitle">Join us today!</p>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName"
                        name="full_name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                        name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                        name="phone" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                        name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        required>
                </div>

                <p id="message" class="message"></p>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

                <p class="auth-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </form>

        </section>

    </main>

    <script type="module" src="js/pages/register.js"></script>

</body>
</html>
